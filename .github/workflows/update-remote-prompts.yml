name: Update remote prompts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-remote-prompts
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test feed updater
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Refresh prompts and verify offers
        run: python scripts/update_remote_prompts.py

      - name: Commit feed changes
        run: |
          if git diff --quiet -- remote_prompts.json; then
            echo "Feed is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote_prompts.json
          git commit -m "chore: refresh remote prompts and AI deals"
          git push
